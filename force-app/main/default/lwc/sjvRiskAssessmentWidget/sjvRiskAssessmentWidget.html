<template>
    <lightning-card title="Clinical Risk Assessment & Resource Planning" icon-name="standard:survey">
        <!-- Action Buttons Slot -->
        <div slot="actions">
            <template if:true={hasActiveAssessment}>
                <lightning-button-group>
                    <template if:true={isDraft}>
                        <lightning-button variant="brand" label="Approve Assessment" icon-name="utility:check" onclick={handleApprove}></lightning-button>
                    </template>
                    <template if:true={isApproved}>
                        <lightning-button variant="neutral" label="Generate Shifts & Demand" icon-name="utility:event" onclick={handleGenerateDemand}></lightning-button>
                        <lightning-button variant="neutral" label="Generate Commercial Quote" icon-name="utility:quotes" onclick={handleGenerateQuote}></lightning-button>
                        <lightning-button variant="brand-outline" label="Revise Assessment (v2)" icon-name="utility:refresh" onclick={openRevisionModal}></lightning-button>
                    </template>
                </lightning-button-group>
            </template>
            <template if:false={hasActiveAssessment}>
                <lightning-button variant="brand" label="Run Initial Risk Assessment (v1)" icon-name="utility:new" onclick={openNewAssessmentModal}></lightning-button>
            </template>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading Assessment Data" size="medium"></lightning-spinner>
            </template>

            <!-- MANDATORY CLINICAL DISCLAIMER BANNER -->
            <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                <span class="slds-assistive-text">warning</span>
                <h2><strong>Regulatory Notice:</strong> {disclaimer} (Rule Set: v1.0-Illustrative)</h2>
            </div>

            <!-- Error Banner -->
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <!-- Success Banner -->
            <template if:true={successMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_small" role="alert">
                    <span class="slds-assistive-text">success</span>
                    <h2>{successMessage}</h2>
                </div>
            </template>

            <template if:true={hasActiveAssessment}>
                <!-- Header Highlights Card -->
                <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                    <div class="slds-grid slds-gutters slds-wrap slds-grid_vertical-align-center">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                            <span class="slds-text-title_caps">Assessment Version</span>
                            <div class="slds-text-heading_medium">
                                Version {currentAssessment.Version_Number__c}
                                <span class={statusBadgeClass}>{currentAssessment.Status__c}</span>
                            </div>
                            <p class="slds-text-body_small slds-text-color_weak">{currentAssessment.Reason_For_Change__c}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                            <span class="slds-text-title_caps">Risk Score & Band</span>
                            <div class="slds-text-heading_medium">
                                {currentAssessment.Total_Risk_Score__c} / 100
                                <span class={bandBadgeClass}>{currentAssessment.Risk_Band__c}</span>
                            </div>
                            <p class="slds-text-body_small slds-text-color_weak">Decision: {currentAssessment.Reviewer_Decision__c}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                            <span class="slds-text-title_caps">Proposed Staffing</span>
                            <div class="slds-text-heading_medium">
                                {currentAssessment.Proposed_Staff_Count__c} staff ({currentAssessment.Proposed_Staff_Hours__c} hrs)
                            </div>
                            <p class="slds-text-body_small slds-text-color_weak">Internal Cost: ${currentAssessment.Estimated_Internal_Cost__c}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                            <span class="slds-text-title_caps">Commercial Selling Price</span>
                            <div class="slds-text-heading_medium slds-text-color_success">
                                ${currentAssessment.Estimated_Selling_Price__c}
                            </div>
                            <p class="slds-text-body_small slds-text-color_weak">Projected Margin: ${projectedMargin} ({marginPercent}%)</p>
                        </div>
                    </div>
                </div>

                <!-- Tabs: Requirements, Answers, History -->
                <lightning-tabset>
                    <!-- TAB 1: Resource Requirements -->
                    <lightning-tab label="Resource Requirements & Costing" icon-name="standard:resource_capacity">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col">Category</th>
                                    <th scope="col">Role / Item</th>
                                    <th scope="col">Qty</th>
                                    <th scope="col">Hours</th>
                                    <th scope="col">Cost Rate</th>
                                    <th scope="col">Sell Rate</th>
                                    <th scope="col">Cost Total</th>
                                    <th scope="col">Sell Total</th>
                                    <th scope="col">Margin</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={requirements} for:item="req">
                                    <tr key={req.Id}>
                                        <td><lightning-badge label={req.Category__c}></lightning-badge></td>
                                        <td><strong>{req.Role_or_Item_Name__c}</strong></td>
                                        <td>{req.Quantity__c}</td>
                                        <td>{req.Duration_Hours__c} hrs</td>
                                        <td>${req.Internal_Cost_Rate__c}</td>
                                        <td>${req.Selling_Rate__c}</td>
                                        <td>${req.Internal_Cost_Total__c}</td>
                                        <td>${req.Selling_Price_Total__c}</td>
                                        <td class="slds-text-color_success">${req.sellingCostDiff}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </lightning-tab>

                    <!-- TAB 2: Questionnaire Answers -->
                    <lightning-tab label="Clinical Risk Answers" icon-name="standard:question_best">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col">Category</th>
                                    <th scope="col">Question</th>
                                    <th scope="col">Organiser Answer</th>
                                    <th scope="col">Score Contribution</th>
                                    <th scope="col">Clinical Rationale</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={answers} for:item="ans">
                                    <tr key={ans.Id}>
                                        <td>{ans.Question_Category__c}</td>
                                        <td><strong>{ans.Question_Text__c}</strong></td>
                                        <td><span class="slds-badge slds-theme_shade">{ans.Answer_Value__c}</span></td>
                                        <td>+{ans.Score_Contribution__c} pts</td>
                                        <td class="slds-text-color_weak">{ans.Scoring_Explanation__c}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </lightning-tab>

                    <!-- TAB 3: Version History -->
                    <lightning-tab label="Version Audit History" icon-name="standard:data_streams">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col">Version</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Score / Band</th>
                                    <th scope="col">Staff</th>
                                    <th scope="col">Internal Cost</th>
                                    <th scope="col">Selling Price</th>
                                    <th scope="col">Reason for Change</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={assessments} for:item="ass">
                                    <tr key={ass.Id}>
                                        <td><strong>v{ass.Version_Number__c}</strong></td>
                                        <td><span class="slds-badge">{ass.Status__c}</span></td>
                                        <td>{ass.Total_Risk_Score__c} ({ass.Risk_Band__c})</td>
                                        <td>{ass.Proposed_Staff_Count__c}</td>
                                        <td>${ass.Estimated_Internal_Cost__c}</td>
                                        <td>${ass.Estimated_Selling_Price__c}</td>
                                        <td>{ass.Reason_For_Change__c}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </lightning-tab>
                </lightning-tabset>
            </template>

            <template if:false={hasActiveAssessment}>
                <div class="slds-box slds-text-align_center slds-p-around_large slds-theme_shade">
                    <p class="slds-text-heading_small slds-m-bottom_small">No Risk Assessment on file for this operational event.</p>
                    <p class="slds-text-body_regular slds-m-bottom_medium">Click below to execute the deterministic rule engine and generate version 1 staffing requirements.</p>
                    <lightning-button variant="brand" label="Execute Risk Assessment Rule Engine" icon-name="utility:calculator" onclick={openNewAssessmentModal}></lightning-button>
                </div>
            </template>
        </div>

        <!-- REVISION / NEW ASSESSMENT MODAL -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                        <p class="slds-m-top_x-small slds-text-color_error">Notice: {disclaimer}</p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-grid slds-gutters slds-wrap">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input type="number" label="Expected Peak Attendance" value={modalInput.expectedAttendance} onchange={handleModalAttendanceChange}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input type="number" step="0.5" label="Duration (Hours)" value={modalInput.durationHours} onchange={handleModalDurationChange}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox label="Venue Environment" value={modalInput.indoorOutdoor} options={settingOptions} onchange={handleModalSettingChange}></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox label="Alcohol Service" value={modalInput.alcoholPresent} options={alcoholOptions} onchange={handleModalAlcoholChange}></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox label="High-Risk Activities" value={modalInput.highRiskActivities} options={hazardOptions} onchange={handleModalHazardChange}></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox label="First Aid Post Needed" value={modalInput.firstAidPostNeeded} options={postOptions} onchange={handleModalPostChange}></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-1">
                                <lightning-input label="Reason for Revision / Assessment Notes" value={modalInput.reasonForChange} onchange={handleModalReasonChange} placeholder="e.g. Revised expected crowd up to 5,000; St John absorbing extra responder cost."></lightning-input>
                            </div>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button variant="brand" label="Calculate & Save Assessment" onclick={handleCalculateSubmit}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
