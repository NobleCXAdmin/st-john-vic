<template>
    <lightning-card title="St John VIC — Inbound Enquiry Qualification &amp; Conversion" icon-name="standard:lead">
        <div slot="actions">
            <template if:true={isConverted}>
                <lightning-badge label="Converted to Opportunity" class="slds-theme_success"></lightning-badge>
            </template>
            <template if:false={isConverted}>
                <lightning-badge label={eventType} class="slds-badge_inverse slds-m-right_xx-small"></lightning-badge>
                <lightning-badge label={leadSourceBadge}></lightning-badge>
            </template>
        </div>

        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Processing" size="small"></lightning-spinner>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <template if:true={successMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_small" role="alert">
                    <span class="slds-assistive-text">success</span>
                    <h2>{successMessage}</h2>
                </div>
            </template>

            <template if:true={isConverted}>
                <div class="slds-box slds-theme_shade slds-text-align_center slds-p-around_large">
                    <lightning-icon icon-name="action:approval" size="medium" class="slds-m-bottom_small"></lightning-icon>
                    <h2 class="slds-text-heading_medium slds-text-color_success slds-m-bottom_x-small">
                        Lead Successfully Qualified &amp; Converted
                    </h2>
                    <p class="slds-text-body_regular slds-m-bottom_medium slds-text-color_weak">
                        Converted into an Event Opportunity, Clinical Risk Assessment, and Volunteer Initiative booking hierarchy.
                    </p>
                    <div class="slds-grid slds-grid_align-center">
                        <template if:true={opportunityId}>
                            <lightning-button variant="brand" label="View Event Opportunity" icon-name="standard:opportunity" class="slds-m-right_x-small" onclick={navigateToOpportunity}></lightning-button>
                        </template>
                        <template if:true={initiativeId}>
                            <lightning-button variant="neutral" label="View Volunteer Initiative" icon-name="custom:custom68" onclick={navigateToInitiative}></lightning-button>
                        </template>
                    </div>
                </div>
            </template>

            <template if:false={isConverted}>
                <!-- Top Summary Ribbon -->
                <div class="slds-box slds-theme_shade slds-m-bottom_medium" style="border-left: 4px solid #007038;">
                    <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_xx-small">
                            <span class="slds-text-color_weak slds-text-body_small">Event Name</span>
                            <div class="slds-text-heading_small slds-truncate"><strong>{eventName}</strong></div>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_xx-small">
                            <span class="slds-text-color_weak slds-text-body_small">Organisation / Company</span>
                            <div class="slds-text-heading_small slds-truncate">{organisationName}</div>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_xx-small">
                            <span class="slds-text-color_weak slds-text-body_small">Intake Channel</span>
                            <div><span class="slds-badge slds-theme_shade">{leadSourceBadge}</span></div>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-around_xx-small">
                            <span class="slds-text-color_weak slds-text-body_small">Crowd Attendance</span>
                            <div><strong>{attendance}</strong> attendees</div>
                        </div>
                    </div>
                </div>

                <!-- Intake Details Scoped Tabs -->
                <lightning-tabset variant="scoped" class="slds-m-bottom_medium">
                    <!-- Tab 1: Event & Venue Logistics -->
                    <lightning-tab label="Event &amp; Venue Logistics" icon-name="utility:event">
                        <div class="slds-grid slds-gutters slds-wrap slds-p-around_small">
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Event Name:</span>
                                <div class="slds-text-body_regular"><strong>{eventName}</strong></div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Event Category:</span>
                                <div><lightning-badge label={eventType}></lightning-badge></div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Dates:</span>
                                <div>{dates}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Daily Operating Hours:</span>
                                <div>{dailyHours}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Venue / Location:</span>
                                <div><strong>{venue}</strong></div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Venue Address:</span>
                                <div>{venueAddress}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Venue Environment:</span>
                                <div>{indoorOutdoor}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Event Accessibility:</span>
                                <div>{publicOrPrivate}</div>
                            </div>
                        </div>
                    </lightning-tab>

                    <!-- Tab 2: Clinical Risk & Operations -->
                    <lightning-tab label="Clinical Risk &amp; Operations" icon-name="utility:shield">
                        <div class="slds-grid slds-gutters slds-wrap slds-p-around_small">
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Alcohol Served:</span>
                                <div><strong>{alcohol}</strong></div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">High-Risk Activities / Hazards:</span>
                                <div><strong>{highRisk}</strong></div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Dedicated First Aid Room:</span>
                                <div>{firstAidRoom}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Setup &amp; Site Access:</span>
                                <div>{setupInstructions}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Requested Clinical Coverage Notes:</span>
                                <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-top_xx-small">{coverageNotes}</div>
                            </div>
                        </div>
                    </lightning-tab>

                    <!-- Tab 3: Client & Event-Day Contact -->
                    <lightning-tab label="Client &amp; Contacts" icon-name="utility:user">
                        <div class="slds-grid slds-gutters slds-wrap slds-p-around_small">
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Primary Organiser:</span>
                                <div><strong>{contactName}</strong></div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Organiser Role:</span>
                                <div>{customerRole}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Organisation / Company:</span>
                                <div><strong>{organisationName}</strong></div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Previous St John Customer:</span>
                                <div>{previousCustomer}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Email:</span>
                                <div><a href={emailMailto}>{contactEmail}</a></div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Phone:</span>
                                <div><a href={phoneTel}>{contactPhone}</a></div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Event-Day Emergency Contact:</span>
                                <div>{eventDayContactName}</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <span class="slds-text-color_weak">Event-Day Emergency Phone:</span>
                                <div>{eventDayContactPhone}</div>
                            </div>
                        </div>
                    </lightning-tab>
                </lightning-tabset>

                <!-- BDM Qualification & Action Footer -->
                <div class="slds-box slds-theme_shade slds-p-around_small slds-m-bottom_small">
                    <div class="slds-m-bottom_small">
                        <lightning-textarea label="BDM Qualification Notes" value={qualificationNotes} onchange={handleNotesChange} placeholder="e.g. Confirmed site access times and confirmed alcohol licence is approved. Ready for clinical risk assessment."></lightning-textarea>
                    </div>

                    <div class="slds-grid slds-grid_align-end slds-grid_vertical-align-center">
                        <span class="slds-text-color_weak slds-m-right_medium slds-text-body_small">
                            Converts Lead to Event Opportunity &amp; Volunteer Initiative
                        </span>
                        <lightning-button variant="brand" label="Qualify &amp; Convert to Event" icon-name="utility:change_record_type" onclick={handleConvert} disabled={isLoading}></lightning-button>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
